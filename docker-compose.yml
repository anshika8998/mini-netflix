version: '3.8'

services:

  # Service 1: Your Node.js app
  app:
    build: .                          # build from Dockerfile in current folder
    ports:
      - "3000:3000"                   # expose port 3000
    environment:
      - MONGO_URL=mongodb://mongo:27017/mininetflix
    depends_on:
      - mongo                         # wait for mongo to start first
    restart: unless-stopped           # auto restart if it crashes

  # Service 2: MongoDB database
  mongo:
    image: mongo:6                    # use official MongoDB image
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db           # persist data even if container stops
    restart: unless-stopped

  # Service 3: Mongo Express (database UI)
  mongo-express:
    image: mongo-express:latest
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      - mongo
    restart: unless-stopped

# Named volume — stores MongoDB data permanently
volumes:
  mongo-data: